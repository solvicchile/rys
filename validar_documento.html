<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validacion Documental GCDRYS</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #20242a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f5f8;
    }

    main {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px 20px 28px;
    }

    .logo {
      display: block;
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .estado {
      width: 100%;
      border-radius: 8px;
      padding: 14px 12px;
      color: #ffffff;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .vigente {
      background: #1f8f45;
    }

    .no-vigente {
      background: #c0392b;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 21px;
      line-height: 1.25;
      text-align: center;
    }

    .codigo {
      margin: 0 0 22px;
      color: #2d5bd1;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .datos {
      border-top: 1px solid #e3e7ee;
      border-bottom: 1px solid #e3e7ee;
      padding: 14px 0;
    }

    .fila {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      padding: 9px 0;
      font-size: 15px;
      line-height: 1.3;
    }

    .etiqueta {
      color: #687180;
      text-align: right;
    }

    .valor {
      color: #20242a;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .estado-documental {
      display: inline-block;
      min-width: 128px;
      border-radius: 8px;
      padding: 8px 12px;
      color: #ffffff;
      text-align: center;
      font-weight: 700;
    }

    .confidencial {
      display: inline-block;
      margin-top: 10px;
      border-radius: 8px;
      padding: 8px 12px;
      background: #8e1b1b;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
    }

    .estado-borrador {
      background: #64748b;
    }

    .estado-revision,
    .estado-pendiente {
      background: #d79b00;
    }

    .estado-vigente {
      background: #1f8f45;
    }

    .estado-obsoleto,
    .estado-anulado {
      background: #c0392b;
    }

    .pie {
      margin-top: 20px;
      color: #687180;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .aviso {
      margin-top: 30px;
      padding: 16px;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #f8fafc;
      color: #2f3b4a;
      font-size: 15px;
      line-height: 1.4;
    }

    .error {
      border-color: #e0b4b4;
      background: #fff6f6;
      color: #8a1f1f;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Logo">
    <section id="contenido">
      <div class="aviso">Consultando estado documental...</div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://xgajgsranipwivnspsot.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_beOtFVmvJKiksyHZn_isAg_E-2wSlWp";
    const contenido = document.querySelector("#contenido");

    function parametroCodigo() {
      const params = new URLSearchParams(window.location.search);
      const codigo = (params.get("codigo") || "").trim();

      if (codigo) {
        return codigo;
      }

      const datoAnterior = params.get("d");

      if (!datoAnterior) {
        return "";
      }

      try {
        const normalizado = datoAnterior.replace(/-/g, "+").replace(/_/g, "/");
        const relleno = "=".repeat((4 - normalizado.length % 4) % 4);
        const json = decodeURIComponent(
          Array.from(atob(normalizado + relleno), c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")
        );
        return (JSON.parse(json).codigo || "").trim();
      } catch (error) {
        return "";
      }
    }

    function valor(texto) {
      return texto && String(texto).trim() ? String(texto) : "Pendiente";
    }

    function escapar(texto) {
      return valor(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatearFecha(fecha) {
      if (!fecha) {
        return "Pendiente";
      }

      const valorFecha = new Date(fecha);

      if (Number.isNaN(valorFecha.getTime())) {
        return fecha;
      }

      return valorFecha.toLocaleString("es-CL", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function mostrarError(mensaje) {
      contenido.innerHTML = `<div class="aviso error">${escapar(mensaje)}</div>`;
    }

    function renderizar(datos) {
      const vigente = datos.vigencia === "VIGENTE";
      const claseEstado = vigente ? "vigente" : "no-vigente";
      const claseEstadoDocumental = claseEstadoActual(datos.estado);
      const confidencial = datos.confidencial === true || datos.confidencial === "true";
      const avisoConfidencial = confidencial ? `<div class="confidencial">DOCUMENTO CONFIDENCIAL</div>` : "";

      contenido.innerHTML = `
        <div class="estado ${claseEstado}">${escapar(datos.vigencia)}</div>
        ${avisoConfidencial}
        <h1>${escapar(datos.nombre)}</h1>
        <p class="codigo">${escapar(datos.codigo)}</p>
        <div class="datos">
          <div class="fila"><div class="etiqueta">Estado</div><div class="valor"><span class="estado-documental ${claseEstadoDocumental}">${escapar(datos.estado)}</span></div></div>
          <div class="fila"><div class="etiqueta">Confidencial</div><div class="valor">${confidencial ? "SI" : "NO"}</div></div>
          <div class="fila"><div class="etiqueta">Creado por</div><div class="valor">${escapar(datos.creado_por)}</div></div>
          <div class="fila"><div class="etiqueta">Fecha creacion</div><div class="valor">${escapar(formatearFecha(datos.fecha_creacion))}</div></div>
          <div class="fila"><div class="etiqueta">Revisado por</div><div class="valor">${escapar(datos.revisado_por)}</div></div>
          <div class="fila"><div class="etiqueta">Fecha revision</div><div class="valor">${escapar(formatearFecha(datos.fecha_revision))}</div></div>
          <div class="fila"><div class="etiqueta">Aprobado por</div><div class="valor">${escapar(datos.aprobado_por)}</div></div>
          <div class="fila"><div class="etiqueta">Fecha aprobacion</div><div class="valor">${escapar(formatearFecha(datos.fecha_aprobacion))}</div></div>
        </div>
        <p class="pie">Validacion en tiempo real generada por GCDRYS-2.</p>
      `;
    }

    function claseEstadoActual(estado) {
      const normalizado = valor(estado).toLowerCase();

      if (normalizado === "vigente") {
        return "estado-vigente";
      }

      if (normalizado === "en revision") {
        return "estado-revision";
      }

      if (normalizado === "pendiente aprobacion" || normalizado === "pendiente de revision") {
        return "estado-pendiente";
      }

      if (normalizado === "obsoleto") {
        return "estado-obsoleto";
      }

      if (normalizado === "anulado") {
        return "estado-anulado";
      }

      return "estado-borrador";
    }

    async function consultarDocumento(codigo) {
      if (SUPABASE_ANON_KEY === "PEGAR_ANON_KEY_AQUI") {
        throw new Error("Falta configurar SUPABASE_ANON_KEY en validar_documento.html.");
      }

      if (SUPABASE_ANON_KEY.startsWith("http")) {
        throw new Error("SUPABASE_ANON_KEY no debe ser una URL. Pegue la anon public key del proyecto.");
      }

      const url = `${SUPABASE_URL}/rest/v1/validacion_documental_publica?codigo=eq.${encodeURIComponent(codigo)}&select=*`;
      const respuesta = await fetch(url, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      });

      if (!respuesta.ok) {
        const detalle = await respuesta.text();
        throw new Error(`No se pudo consultar el estado documental. HTTP ${respuesta.status}: ${detalle.slice(0, 180)}`);
      }

      const datos = await respuesta.json();

      if (!datos.length) {
        throw new Error("Documento no encontrado o no disponible para validacion publica.");
      }

      return datos[0];
    }

    async function iniciar() {
      const codigo = parametroCodigo();

      if (!codigo) {
        mostrarError("El QR no contiene codigo documental.");
        return;
      }

      try {
        const documento = await consultarDocumento(codigo);
        renderizar(documento);
      } catch (error) {
        mostrarError(error.message);
      }
    }

    iniciar();
  </script>
</body>
</html>
